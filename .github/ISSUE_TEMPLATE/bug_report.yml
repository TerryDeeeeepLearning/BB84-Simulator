name: Bug report
description: Something in the simulator behaves wrongly or a result looks physically incorrect
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Scenario, pulses, Eve mode, and the Seed if you set one (a seed makes the run exactly reproducible).
      placeholder: |
        1. Scenario: Metro fiber · 25 km
        2. Eve: Photon-number splitting (PNS)
        3. Seed: poster-2026
        4. Press Run all
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulator tab
        - Lab · Data charts
        - Guide tab
        - Language switch (English / 繁體中文)
        - Export (.qasm / session .json / figures)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
